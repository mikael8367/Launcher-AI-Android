name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already contain Android command-line tools.
      # Avoid android-actions/setup-android, which tried to install the removed
      # legacy SDK package named "tools" and failed before Gradle could run.
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$SDK_DIR/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            echo "Android sdkmanager was not found in $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
